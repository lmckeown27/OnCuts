<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon - Multiple sizes for Google and browser compatibility -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Web Manifest for PWA and Google -->
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Viewport - viewport-fit=cover ensures content extends into safe areas -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Meta for SEO and Google -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Fair prices for students, great earnings for barbers. Book haircuts on campus with transparent pricing and instant payments." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="CampusCut" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://campuscut.com/" />
    <meta property="og:title" content="CampusCut - Earn More, Pay Less" />
    <meta property="og:description" content="Fair prices for students, great earnings for barbers. Book haircuts on campus with transparent pricing and instant payments." />
    <meta property="og:image" content="https://campuscut.com/icon-512x512.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CampusCut - Earn More, Pay Less" />
    <meta name="twitter:description" content="Fair prices for students, great earnings for barbers. Book haircuts on campus." />
    <meta name="twitter:image" content="https://campuscut.com/icon-512x512.png" />
    
    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CampusCut" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>CampusCut - Earn More, Pay Less</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
