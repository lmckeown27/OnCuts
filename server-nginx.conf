# CampusCuts / TivelaPlatforms Production Nginx Configuration
# EC2: /etc/nginx/sites-available/campuscuts (symlink in sites-enabled)
# Test: sudo nginx -t && sudo systemctl reload nginx
# Certs: sudo certbot certificates  (match ssl_certificate paths below)

# Redirect HTTP → HTTPS (Tivela — primary production domain)
server {
    listen 80;
    listen [::]:80;
    server_name tivelaplatforms.com www.tivelaplatforms.com;
    return 301 https://tivelaplatforms.com$request_uri;
}

# TivelaPlatforms — frontend + API reverse proxy (Node/PM2 on :3001)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tivelaplatforms.com www.tivelaplatforms.com;

    # After: sudo certbot certonly --nginx -d tivelaplatforms.com -d www.tivelaplatforms.com
    ssl_certificate /etc/letsencrypt/live/tivelaplatforms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tivelaplatforms.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/campuscuts/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API → Express backend (required — without this, POST /api/* returns 405)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Stripe webhooks (preserve raw body for signature verification)
    location /api/webhooks/stripe {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

